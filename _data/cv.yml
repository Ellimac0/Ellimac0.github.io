cv:
  name: Camille Billouard
  label: PhD in AI (Dec. 2026), 3D Vision & Neural Scene Representations
  email: camillebillouard314@gmail.com
  location: Paris, France
  website: https://ellimac0.github.io
  image: ""
  summary: "AI researcher working on neural 3D representations of the physical world: reconstruction with NeRF and Gaussian Splatting from real imagery, multi-view geometry and camera models, scaled to kilometre-scale scenes. I design GPU-efficient, memory-bounded training pipelines (PyTorch, custom CUDA, HPC), evaluate them rigorously against ground truth, and release reproducible open-source code."

  social_networks:
    - network: GitHub
      username: Ellimac0
    - network: Google Scholar
      username: CImHtKMAAAAJ

  sections:
    Experience:
      - company: CNES (French Space Agency) & LASTIG, IGN (French Mapping Agency)
        position: PhD Researcher
        location: Paris, France
        start_date: 2023-10
        end_date: 2026-10
        summary: 3 years
        highlights:
          - "Formalised compute-independent scalability for neural scene representations (linear time, bounded memory, preserved quality, no reliance on larger hardware) and derived a **fully scalable pipeline** on real multi-view satellite data."
          - "Built **Snake-NeRF**: out-of-core tiling that reconstructs **52 km²** of Pléiades Neo imagery (442 tiles) **on a single commercial 16 GB GPU**, with bounded peak memory (within 1% of the analytical prediction), 5× lower host memory and near-linear runtime."
          - "Built **SAT-NGP**: transient-free multi-date NeRF training **86–200× faster** (10–20 h down to 4–14 min) with elevation error within 0.19 m of the state of the art; open-source code reused by other groups as a reference baseline."
          - "Wrote custom CUDA / C++ kernels integrated into PyTorch for the full rendering pipeline (ray generation from RPC camera models, segmented volume rendering, ray sorting)."
          - "Designed the 3D evaluation protocol against LiDAR HD ground truth: metric choice (elevation error, completeness, masking of vegetation and changing areas), comparison pipeline (co-registration with xDEM, resampling) and test-set definition."

