    Experience:
      - company: CNES & LASTIG (IGN)
        position: PhD Candidate
        location: Paris, France
        start_date: 2023-10
        end_date: 2026-10
        highlights:
          - "Designed **SAT-NGP**: satellite NeRF training **86 to 200 times faster** (from 10–20 h to 4–14 min), altitude error within 0.19 m of the state of the art; now a reference for efficient 3D Earth observation."
          - "Designed **Snake-NeRF**: out-of-core tiling reconstructing **52 km²** of Pléiades Neo imagery (442 tiles) **on a single GPU**, peak memory under 2 GB (within 1% of the analytical prediction), host memory divided by 5, near-linear runtime."
          - Formalised the scalability of neural rendering and a power law of reconstruction error as a function of tile size.
          - Custom CUDA kernels (RPC ray generation) and DSM evaluation pipelines against IGN LiDAR HD, on SLURM clusters.

      - company: CNES
