# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: "Camille Billouard" # the website title (if blank, full name will be used instead)
first_name: "Camille"
middle_name:
last_name: "Billouard"
email: "camille.billouard@cnes.fr" # TODO: replace with your institutional email if preferred
description: > # the ">" symbol means to ignore newlines until "footer_text:"
  Personal website of Camille Billouard, PhD candidate in 3D computer vision
  and neural rendering for satellite imagery at CNES, in collaboration with
  IGN/LASTIG and Univ Gustave Eiffel.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a>
  with <a href="https://github.com/alshedivat/al-folio" target="_blank" rel="external nofollow noopener">al-folio</a> theme.

icon_html: <i class="fa-solid fa-cube"></i> # favicon: cube icon (3D/CV theme)
keywords: computer vision, neural radiance fields, NeRF, LiDAR, 3D reconstruction, remote sensing, deep learning, PhD

lang: en # the language of your site (for example: en, fr, cn, ru, etc.)

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------

url: https://ellimac0.github.io # the base hostname & protocol for your site
baseurl: # the subpath of your site, e.g. /blog/. Leave empty for root.
last_updated: false # set to true if you want to display last updated in the footer
impressum_path: # set to path to include impressum link in the footer, use the same path as permalink in a page, helps to conform with EU GDPR

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Light/dark mode default
default_mode: "auto" # "light", "dark", or "auto"

# Repository (used to link to your GitHub)
repo: Ellimac0/Ellimac0.github.io

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------
rss_icon: true

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true

# Dimensions
max_width: 800px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------
serve_og_meta: true
serve_schema_org: true
og_image: # TODO: add /assets/img/og.jpg for nicer link previews on LinkedIn/X/Slack

# -----------------------------------------------------------------------------
# Social integration
# -----------------------------------------------------------------------------

github_username: Ellimac0
gitlab_username:
twitter_username:
mastodon_username:
linkedin_username: # TODO: your LinkedIn user name (the part after /in/)
scholar_userid: # TODO: your Google Scholar ID
semanticscholar_id:
whatsapp_number:
orcid_id: # TODO: your ORCID ID (without the URL)
medium_username:
quora_username:
publons_id:
research_gate_profile:
blogger_url:
work_url:
youtube_id:
keybase_username:
wikidata_id:
wikipedia_id:
strava_userid:
stackoverflow_id:
kaggle_id:
lastfm_id:
spotify_id:
pinterest_id:
unsplash_id:
instagram_id:
facebook_id:
discord_id:
zotero_username:
osf_id:
google_analytics:

contact_note: >
  Best way to reach me is via email.

# -----------------------------------------------------------------------------
# Blog
# -----------------------------------------------------------------------------

blog_name: blog
blog_description: thoughts, notes, and research log
permalink: /blog/:year/:title/
lsi: false

# Pagination
pagination:
  enabled: true

# Comments
disqus_shortname:
giscus:
  repo:

external_sources:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5
news_scrollable: true
news_move_to_top_date:

announcements:
  enabled: true
  scrollable: true
  limit: 5

latest_posts:
  enabled: true
  scrollable: true
  limit: 3

selected_papers: true

# -----------------------------------------------------------------------------
# Jekyll Scholar
# -----------------------------------------------------------------------------

scholar:
  last_name: ["Billouard"]
  first_name: ["Camille", "C."]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  group_by: year
  group_order: descending

  bibtex_filters: [latex, smallcaps, superscript]

  show_bibtex_button: true
  show_abstract_button: true
  show_diff_badge_button: true
  show_thumbnail: true

enable_publication_thumbnails: true
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
  isidore: false
  semanticscholar: false

filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric, dimensions, google_scholar_id, video, additional_info, annotation, editor, journal_abbr, isidore, inspirehep_id, semanticscholar]

# -----------------------------------------------------------------------------
# Jekyll Link Attributes
# -----------------------------------------------------------------------------

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:

# -----------------------------------------------------------------------------
# Responsive WebP Images
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
    - 480
    - 800
    - 1400
  input_directories:
    - assets/img/
  input_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".tiff"
  output_formats:
    webp: "-resize-only 800x480>"

# -----------------------------------------------------------------------------
# Jekyll Diff
# -----------------------------------------------------------------------------

jekyll_diff:
  hide: false

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false
enable_panelbear_analytics: false
enable_google_verification: false
enable_bing_verification: false
enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true
enable_medium_zoom: true
enable_progressbar: true
enable_video_embed: true

